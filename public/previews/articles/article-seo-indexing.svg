<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Abstract illustration of a search index graph">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101629" />
      <stop offset="1" stop-color="#1E2540" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6328F5" />
      <stop offset="0.55" stop-color="#8B5CFF" />
      <stop offset="1" stop-color="#5FD3C4" />
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7A4DFF" stop-opacity="0.55" />
      <stop offset="1" stop-color="#7A4DFF" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#FFFFFF" fill-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#night)" />
  <rect width="1600" height="900" fill="url(#dots)" />
  <circle cx="1210" cy="300" r="420" fill="url(#glow)" />
  <g fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round">
    <path d="M150 620 L360 560 L560 600 L760 430 L960 470 L1160 300 L1420 220" />
  </g>
  <g fill="#FFFFFF">
    <circle cx="150" cy="620" r="10" />
    <circle cx="360" cy="560" r="10" />
    <circle cx="560" cy="600" r="10" />
    <circle cx="760" cy="430" r="10" />
    <circle cx="960" cy="470" r="10" />
    <circle cx="1160" cy="300" r="12" fill="#5FD3C4" />
    <circle cx="1420" cy="220" r="12" fill="#5FD3C4" />
  </g>
  <g fill="#FFFFFF" fill-opacity="0.1">
    <rect x="1060" y="500" width="330" height="230" rx="24" />
    <rect x="1100" y="545" width="250" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.4" />
    <rect x="1100" y="585" width="180" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.25" />
    <rect x="1100" y="615" width="210" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.25" />
    <rect x="1100" y="665" width="120" height="38" rx="19" fill="#6328F5" fill-opacity="0.9" />
  </g>
  <text x="150" y="780" fill="#E9E6F5" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="-1">WEBSENSIAL JOURNAL</text>
  <text x="150" y="820" fill="#8F93AE" font-family="Helvetica, Arial, sans-serif" font-size="20" letter-spacing="6">SEO · INDEXING NOTES</text>
